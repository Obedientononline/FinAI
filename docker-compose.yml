version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safe_wealth_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_SECRET_KEY=safe-wealth-advisory-secret-key
      - LYZR_AGENT_API_KEY=${LYZR_AGENT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safe_wealth_frontend
    command: ["python", "-m", "streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - LYZR_AGENT_API_KEY=${LYZR_AGENT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - backend
    restart: unless-stopped
